[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "channel-voice"
version = "0.2.0"
description = "AI Agent -> TTS -> IM Voice Messages. Send TTS voice messages from AI Agents to Feishu, Telegram, DingTalk and more."
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "edge-tts>=6.0",
    "requests>=2.28",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/ghk2501/channel-voice"
Source = "https://github.com/ghk2501/channel-voice"
Changelog = "https://github.com/ghk2501/channel-voice/blob/master/CHANGELOG.md"